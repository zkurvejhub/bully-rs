name: Build bully-rs for WL-500gP (Legacy OpenWrt 19.07)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kód
        uses: actions/checkout@v4

      - name: Příprava závislostí systému
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 file

      - name: Stažení a příprava OpenWrt 19.07 SDK (brcm47xx)
        run: |
          URL="https://archive.openwrt.org/releases/19.07.10/targets/brcm47xx/generic/openwrt-sdk-19.07.10-brcm47xx-generic_gcc-7.5.0_musl.Linux-x86_64.tar.xz"
          
          echo "Stahuji SDK z: $URL"
          curl -fLC - --retry 5 "$URL" -o sdk.tar.xz
          
          file sdk.tar.xz
          
          mkdir -p sdk
          tar -xf sdk.tar.xz -C sdk --strip-components=1

      - name: Instalace Rust Nightly
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup component add rust-src --toolchain nightly

      - name: Kompilace pro WL-500gP
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          
          SDK_DIR="$(pwd)/sdk"
          
          # Hledáme jakoukoliv toolchain složku v staging_dir (bez ohledu na mips/mipsel)
          TOOLCHAIN_DIR=$(find "$SDK_DIR/staging_dir" -mindepth 1 -maxdepth 1 -type d -name "toolchain-*" | head -n 1)
          STAGING_DIR_TARGET=$(find "$SDK_DIR/staging_dir" -mindepth 1 -maxdepth 1 -type d -name "target-*" | head -n 1)
          
          echo "Toolchain dir: $TOOLCHAIN_DIR"
          echo "Target dir: $STAGING_DIR_TARGET"
          
          if [ -z "$TOOLCHAIN_DIR" ]; then
            echo "CHYBA: Složka toolchainu nebyla v SDK nalezena!"
            ls -la "$SDK_DIR/staging_dir"
            exit 1
          fi
          
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export STAGING_DIR="$SDK_DIR/staging_dir"
          
          # Nalezení cross-compileru (gcc)
          GCC_PATH=$(find "$TOOLCHAIN_DIR/bin" -maxdepth 1 -type f -name "*-gcc" | head -n 1)
          
          if [ -z "$GCC_PATH" ]; then
            echo "CHYBA: Linker nebyl nalezen v $TOOLCHAIN_DIR/bin!"
            ls -la "$TOOLCHAIN_DIR/bin"
            exit 1
          fi

          echo "Nalezený GCC linker: $GCC_PATH"
          
          # Příprava konfigurace pro Cargo
          mkdir -p .cargo
          cat <<EOF > .cargo/config.toml
          [target.mipsel-unknown-linux-musl]
          linker = "$GCC_PATH"

          [target.mips-unknown-linux-musl]
          linker = "$GCC_PATH"
          EOF

          # Určení cílového targetu podle architekury (WL-500gP používá mipsel)
          TARGET_ARCH="mipsel-unknown-linux-musl"

          export CC_mipsel_unknown_linux_musl="$GCC_PATH"
          export CFLAGS_mipsel_unknown_linux_musl="-I$STAGING_DIR_TARGET/usr/include"
          export LDFLAGS_mipsel_unknown_linux_musl="-L$STAGING_DIR_TARGET/usr/lib"

          echo "Spouštím Cargo build pro $TARGET_ARCH..."
          cargo +nightly build -Z build-std=core,alloc,std,proc_macro --target $TARGET_ARCH --release
          
          mkdir -p build_output
          cp target/$TARGET_ARCH/release/bully-rs build_output/

      - name: Uložení binárky
        uses: actions/upload-artifact@v4
        with:
          name: bully-rs-wl500gp-19.07
          path: build_output/bully-rs
