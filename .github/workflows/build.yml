name: Build bully-rs for MT7621

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: openwrt/sdk:ramips-mt7621-23.05.0
      options: --user root

    steps:
      - name: Checkout kód
        uses: actions/checkout@v4

      - name: Instalace Rustu
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable

      - name: Kompilace pro MT7621
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add mipsel-unknown-linux-musl
          cargo build --target mipsel-unknown-linux-musl --release

      - name: Uložení binárky
        uses: actions/upload-artifact@v4
        with:
          name: bully-rs-mt7621
          path: target/mipsel-unknown-linux-musl/release/bully-rs
