name: Build bully-rs for WL-500gP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: openwrt/sdk:bcm47xx-mips74k-22.03.5
      options: --user root

    steps:
      - name: Checkout kód
        uses: actions/checkout@v4

      - name: Instalace Rust Nightly
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup component add rust-src --toolchain nightly

      - name: Kompilace pro WL-500gP (MIPS Big Endian)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          
          # Nalezení BCM47xx C toolchainu v SDK
          TOOLCHAIN_DIR=$(ls -d /builder/staging_dir/toolchain-mips_* 2>/dev/null | head -n 1)
          STAGING_DIR_TARGET=$(ls -d /builder/staging_dir/target-mips_* 2>/dev/null | head -n 1)
          
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export STAGING_DIR="/builder/staging_dir"
          
          # Dynamické vyhledání přesného názvu GCC kompilátoru
          GCC_BIN=$(basename $(ls $TOOLCHAIN_DIR/bin/*-gcc 2>/dev/null | head -n 1))
          echo "Nalezený linker: $GCC_BIN"
          
          export CC_mips_unknown_linux_musl="$GCC_BIN"
          export CARGO_TARGET_MIPS_UNKNOWN_LINUX_MUSL_LINKER="$GCC_BIN"
          
          # C flags pro knihovny z SDK
          export CFLAGS_mips_unknown_linux_musl="-I$STAGING_DIR_TARGET/usr/include"
          export LDFLAGS_mips_unknown_linux_musl="-L$STAGING_DIR_TARGET/usr/lib"

          cargo +nightly build -Z build-std=core,alloc,std,proc_macro --target mips-unknown-linux-musl --release

      - name: Uložení binárky
        uses: actions/upload-artifact@v4
        with:
          name: bully-rs-wl500gp
          path: target/mips-unknown-linux-musl/release/bully-rs
