name: Build bully-rs for MT7621

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kód
        uses: actions/checkout@v4

      - name: Instalace Rust Nightly
        run: |
          rustup toolchain install nightly
          rustup default nightly
          rustup component add rust-src --toolchain nightly

      - name: Instalace Cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Příprava Cross.toml (kompilace libpcap ze zdroje)
        run: |
          cat << 'EOF' > Cross.toml
          [target.mipsel-unknown-linux-musl]
          image = "ghcr.io/cross-rs/mipsel-unknown-linux-musl:edge"
          build-std = ["core", "alloc", "std", "proc_macro"]
          pre-build = [
            "apt-get update && apt-get install -y wget build-essential",
            "wget https://www.tcpdump.org/release/libpcap-1.10.4.tar.gz",
            "tar -xzf libpcap-1.10.4.tar.gz",
            "cd libpcap-1.10.4 && ./configure --host=mipsel-linux-musl --prefix=/usr/local && make && make install"
          ]
          EOF

      - name: Kompilace pro MT7621 (MIPSEL)
        run: cross build --target mipsel-unknown-linux-musl --release

      - name: Uložení binárky
        uses: actions/upload-artifact@v4
        with:
          name: bully-rs-mt7621
          path: target/mipsel-unknown-linux-musl/release/bully-rs
